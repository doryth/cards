<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    font:16px/1.5 system-ui,-apple-system,sans-serif;background:#0b0b0c;color:#fafafa}
  main{width:min(680px,92vw);padding:2rem 0}
  h1{font-size:1.35rem;margin:0 0 1.25rem;letter-spacing:-.01em}
  .grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  a.card{display:block;padding:1.1rem 1.2rem;border-radius:1rem;text-decoration:none;
    background:#18181b;color:inherit;border:1px solid #27272a;transition:.15s}
  a.card:hover{background:#222226;transform:translateY(-2px)}
  a.card b{display:block;font-size:1.05rem}
  a.card span{color:#a1a1aa;font-size:.85rem}
</style></head><body><main>
<h1>Cards — pick a deck</h1><div class="grid">
<a class="card" href="./ai101/"><b>AI for Everyone</b><span>/ai101</span></a>
<a class="card" href="./baby/"><b>Pregnancy → 6 years</b><span>/baby</span></a>
<a class="card" href="./bio/"><b>Biology</b><span>/bio</span></a>
<a class="card" href="./health/"><b>Health & Wellness</b><span>/health</span></a>
<a class="card" href="./phys/"><b>Physics</b><span>/phys</span></a>
<a class="card" href="./poli/"><b>Politics</b><span>/poli</span></a>
</div></main></body></html>
